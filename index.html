<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figma Variables Validator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
            color: #333;
        }
        h1 { border-bottom: 2px solid #eee; padding-bottom: 10px; }
        textarea {
            width: 100%;
            height: 300px;
            font-family: monospace;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .actions { margin-bottom: 20px; }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #0056b3; }
        #results { margin-top: 20px; }
        .error {
            background: #fff5f5;
            border-left: 4px solid #c92a2a;
            padding: 10px;
            margin-bottom: 10px;
        }
        .success {
            background: #ebfbee;
            border-left: 4px solid #2b8a3e;
            padding: 15px;
            color: #2b8a3e;
            font-weight: bold;
        }
        .error-title { font-weight: bold; color: #c92a2a; }
        .error-path { font-size: 0.9em; color: #666; margin-top: 4px; }
    </style>
</head>
<body>
    <h1>Figma Variables Validator</h1>
    <p>Paste your Figma variables JSON below or upload a file to find structural problems.</p>

    <div class="actions">
        <input type="file" id="fileInput" accept=".json">
    </div>

    <textarea id="jsonInput" placeholder="Paste JSON here..."></textarea>
    
    <div class="actions">
        <button id="validateBtn">Validate JSON</button>
    </div>

    <div id="results"></div>

    <script src="bundle.js"></script>
</body>
</html>
